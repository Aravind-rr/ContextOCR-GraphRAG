services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/ocr_graphrag.db
      NEO4J_URI: bolt://neo4j:7687
      DOC_LAYOUT_MODEL_PATH: /models/doclayout-yolo/doclayout_yolo_docstructbench_imgsz1024.pt
      EMBEDDING_MODEL: /models/bge-m3-fp16
      EMBEDDING_GGUF_MODEL_PATH: /models/bge-m3-gguf/bge-m3-Q4_K_M.gguf
      SLM_MODEL_PATH: /models/qwen2.5-3b-instruct-gguf/qwen2.5-3b-instruct-q4_k_m.gguf
      LLAMA_SERVER_EXECUTABLE: /opt/llama.cpp/llama-server
      SLM_GPU_LAYERS: 0
    volumes:
      - ./data:/data
      - ./models:/models:ro
    ports: ["8000:8000"]
    depends_on:
      neo4j:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["5173:80"]
    depends_on: [backend]
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-me-now}
    volumes:
      - neo4j_data:/data
    ports: ["7474:7474", "7687:7687"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  neo4j_data:
